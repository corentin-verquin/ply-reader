name: Deploy to Production
run-name: Deploy to Production - ${{ github.ref_name }}

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  infra:
    name: 🏗️ Initialize Infrastructure
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    outputs:
      s3-name: ${{ steps.s3_bucket.outputs.s3-name }}

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4

      - name: 🔐 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ vars.AWS_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: ⚙️ Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4

      - name: 🧱 Terraform Init
        run: terraform init

      - name: 🔍 Terraform Plan
        run: terraform plan

      - name: ✅ Terraform Apply
        run: terraform apply -auto-approve

      - name: export S3 Bucket Name
        id: s3_bucket
        run: echo "s3-name=$(terraform output -raw s3_bucket_name)" >> $GITHUB_OUTPUT

  deploy-frontend:
    needs: [infra]
    name: 🚀 Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4

      - name: 🔐 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ vars.AWS_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: ⚙️ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: 🧩 Install deps
        run: npm ci

      - name: 🚀 Deploy
        run: |
          aws s3 sync . s3://${{ needs.infra.outputs.s3-name }} \
              --exclude "infra/*" \
              --exclude ".git/*" \
              --delete
